name: "🐛 Bug Report"
description: Report a bug or unexpected behavior in RepoPacker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. In accordance with our contributing guidelines, please ensure that any AI-assisted bug diagnoses or proposed patches have been physically reproduced and verified by a human on a real Windows environment.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of what the problem is.
      placeholder: What broke or behaved unexpectedly?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed sequential steps to reproduce the behavior.
      placeholder: |
        1. Open RepoPacker
        2. Enter repository URL '...'
        3. Select preset '...'
        4. Click 'Pack Repository'
        5. See error
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually occurred?
      placeholder: Expected the file to pack without errors, but received exception '...'
    validations:
      required: true

  - type: textarea
    id: ai_diagnosis
    attributes:
      label: AI Diagnosis or Proposed Fix (Optional)
      description: If you used an LLM to analyze the crash, stack trace, or codebase, paste the model's analysis and proposed code changes here.
      placeholder: |
        - Model Used: (e.g., Claude 3.7 Sonnet, GPT-4o, Gemini 2.5 Pro)
        - Model Diagnosis:
        - Proposed C# Solution:
    validations:
      required: false

  - type: checkboxes
    id: human_verification
    attributes:
      label: Human Review & Grounding Checks
      description: Confirm that this issue reflects real behavior rather than synthetic hallucination.
      options:
        - label: I have reproduced this bug manually on an actual Windows machine.
          required: true
        - label: Any stack traces or logs provided were captured from execution, not hallucinated by an AI.
          required: true
        - label: If a fix is proposed, it adheres to our explicit typing rule (zero `var` usage) and .NET 10 standards.
          required: true
